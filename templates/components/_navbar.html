<header class="navbar">
  <div class="container">
    {% include "components/_brand.html" %}
    <nav class="nav-links">
      <a href="{% url 'veiculos:catalogo' %}">Comprar</a>
      <a href="{% url 'veiculos:vendedor_novo' %}">Vender</a>
      <a href="{% url 'servicos:lista' %}">Serviços</a>
      <a href="{% url 'core:index' %}#como-funciona">Como funciona</a>
      <a href="{% url 'core:sobre' %}">Sobre nós</a>
    </nav>
    <div class="nav-actions">
      {% if request.user.is_authenticated %}
        <a href="{% url 'favoritos:comprador_interesses' %}" class="icon-btn" title="Favoritos" aria-label="Favoritos"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg></a>
        <a href="{% url 'usuarios:perfil' %}" class="nav-link-plain">{{ request.user.first_name|default:request.user.email }}</a>
        <form method="post" action="{% url 'usuarios:logout' %}" class="inline-form">{% csrf_token %}<button type="submit" class="btn btn-outline-light btn-sm">Sair</button></form>
      {% else %}
        <a href="{% url 'usuarios:login' %}" class="nav-link-plain">Entrar</a>
        <a href="{% url 'usuarios:cadastro' %}" class="btn btn-primary btn-sm">Cadastrar</a>
      {% endif %}
      <button class="nav-burger" aria-label="Abrir menu"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>
</header>
